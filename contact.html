<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us | Vocabulary Builder</title>

<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Inter", "Segoe UI", Arial, sans-serif;
}


body {

    min-height:100vh;

    background:
        radial-gradient(circle at top left, #312e81, transparent 35%),
        radial-gradient(circle at bottom right, #1d4ed8, transparent 35%),
        #020617;

    color:#f8fafc;
}



header {

    padding:60px 20px 40px;
    text-align:center;

}


.logo {

    width:90px;
    height:90px;

    margin:0 auto 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:45px;

    border-radius:28px;

    background:
        linear-gradient(135deg,#6366f1,#2563eb);

    box-shadow:
        0 20px 50px rgba(37,99,235,.4);

}



header h1 {

    font-size:46px;
    font-weight:800;

    background:
        linear-gradient(90deg,#fff,#93c5fd);

    -webkit-background-clip:text;
    color:transparent;

    margin-bottom:15px;

}



header p {

    color:#cbd5e1;
    font-size:19px;

}



.container {

    max-width:700px;

    margin:auto;

    padding:20px;

}



.card {

    background:
        rgba(15,23,42,.75);

    border:
        1px solid rgba(255,255,255,.1);

    backdrop-filter:
        blur(20px);

    border-radius:30px;

    padding:40px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.45);

    animation:
        appear .8s ease;

}



.form-group {

    margin-bottom:25px;

}



label {

    display:block;

    margin-bottom:10px;

    color:#e2e8f0;

    font-weight:600;

    font-size:15px;

}



input,
textarea {

    width:100%;

    padding:12px 16px;

    border:1px solid rgba(255,255,255,.15);

    border-radius:12px;

    background:rgba(15,23,42,.5);

    color:#f8fafc;

    font-family:inherit;

    font-size:15px;

    transition:all .3s ease;

}



input:focus,
textarea:focus {

    outline:none;

    border-color:rgba(37,99,235,.5);

    background:rgba(15,23,42,.8);

    box-shadow:0 0 0 3px rgba(37,99,235,.1);

}



textarea {

    resize:vertical;

    min-height:150px;

}



input::placeholder,
textarea::placeholder {

    color:#64748b;

}



.form-row {

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

}



.submit-btn {

    width:100%;

    padding:14px 28px;

    background:
        linear-gradient(135deg, #2563eb, #1d4ed8);

    border:none;

    border-radius:12px;

    color:#fff;

    font-weight:700;

    font-size:16px;

    cursor:pointer;

    transition:all .3s ease;

    box-shadow:0 10px 25px rgba(37,99,235,.3);

}



.submit-btn:hover {

    transform:translateY(-2px);

    box-shadow:0 15px 35px rgba(37,99,235,.4);

}



.submit-btn:active {

    transform:translateY(0);

}



.submit-btn.loading {

    opacity:0.7;

    cursor:not-allowed;

}



.alert {

    padding:16px;

    border-radius:12px;

    margin-bottom:25px;

    display:none;

    animation:slideIn .4s ease;

}



.alert.success {

    background:rgba(16,185,129,.15);

    border:1px solid rgba(16,185,129,.3);

    color:#a7f3d0;

}



.alert.error {

    background:rgba(239,68,68,.15);

    border:1px solid rgba(239,68,68,.3);

    color:#fca5a5;

}



.alert.show {

    display:block;

}



footer {

    text-align:center;

    color:#94a3b8;

    padding:40px 20px;

}



@keyframes appear {

    from {

        opacity:0;

        transform:translateY(30px);

    }

    to {

        opacity:1;

        transform:translateY(0);

    }

}



@keyframes slideIn {

    from {

        opacity:0;

        transform:translateY(-10px);

    }

    to {

        opacity:1;

        transform:translateY(0);

    }

}



@media(max-width:600px){

    header h1 {

        font-size:34px;

    }


    .card {

        padding:25px;

        border-radius:22px;

    }


    .form-row {

        grid-template-columns:1fr;

    }

}

</style>

</head>


<body>


<header>

<div class="logo">
📧
</div>


<h1>
Contact Us
</h1>


<p>
We'd love to hear from you. Send us a message!
</p>

</header>


<div class="container">

<div class="card">

<div class="alert" id="alert"></div>

<form id="contactForm">

<div class="form-row">

<div class="form-group">

<label for="name">Your Name</label>

<input type="text" id="name" name="name" placeholder="John Doe" required>

</div>

<div class="form-group">

<label for="email">Your Email</label>

<input type="email" id="email" name="email" placeholder="you@example.com" required>

</div>

</div>

<div class="form-group">

<label for="subject">Subject</label>

<input type="text" id="subject" name="subject" placeholder="How can we help?" required>

</div>

<div class="form-group">

<label for="message">Message</label>

<textarea id="message" name="message" placeholder="Tell us more about your inquiry..." required></textarea>

</div>

<button type="submit" class="submit-btn" id="submitBtn">Send Message</button>

</form>

</div>

</div>


<footer>

© 2026 Vocabulary Builder · We're here to help

</footer>


<script>

const contactForm = document.getElementById('contactForm');
const alert = document.getElementById('alert');
const submitBtn = document.getElementById('submitBtn');

contactForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const subject = document.getElementById('subject').value;
    const message = document.getElementById('message').value;
    
    // Disable submit button
    submitBtn.disabled = true;
    submitBtn.classList.add('loading');
    submitBtn.textContent = 'Sending...';
    
    try {
        // Send to FormSubmit.co (free service that sends emails)
        const formData = new FormData();
        formData.append('name', name);
        formData.append('email', email);
        formData.append('subject', subject);
        formData.append('message', message);
        formData.append('_subject', `New Contact Form: ${subject}`);
        formData.append('_template', 'table');
        
        const response = await fetch('https://formspree.io/f/mzbnvqzk', {
            method: 'POST',
            body: formData,
            headers: {
                'Accept': 'application/json'
            }
        });
        
        if (response.ok) {
            // Success
            showAlert('Message sent successfully! We\'ll get back to you soon.', 'success');
            contactForm.reset();
        } else {
            // Error from server
            showAlert('There was an error sending your message. Please try again.', 'error');
        }
    } catch (error) {
        console.error('Error:', error);
        showAlert('Connection error. Please check your internet and try again.', 'error');
    } finally {
        // Re-enable submit button
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        submitBtn.textContent = 'Send Message';
    }
});

function showAlert(message, type) {
    alert.textContent = message;
    alert.className = `alert ${type} show`;
    
    // Hide alert after 5 seconds
    setTimeout(() => {
        alert.classList.remove('show');
    }, 5000);
}

</script>


</body>
</html>
